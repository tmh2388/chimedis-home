<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khám phá y văn — CHIMEDIS</title>
<link rel="icon" href="assets/logo.png">
<meta name="description" content="Tìm kiếm tài liệu nghiên cứu Trung Y trên các cơ sở dữ liệu học thuật uy tín (OpenAlex, Europe PMC) — hỗ trợ truy vấn tiếng Việt.">
<style>
:root{
  --bg:#F5F0E6;--ink:#0E3A3A;--ink-2:#15514F;--accent:#B4472B;--accent-2:#9A3A22;
  --fg:#241F19;--muted-fg:#6B6156;--card:#FFFFFF;--border:#E4DCCC;--border-strong:#D8CDB8;
  --focus:#1E7A76;--radius:10px;
  --font-serif:"Noto Serif","Songti SC","Noto Serif SC",serif;
  --font-sans:"Noto Sans","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-sans);line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;padding:0 24px}
@media (max-width:640px){.wrap{padding:0 16px}}

header.site{background:var(--ink);color:#F5F0E6;position:sticky;top:0;z-index:40}
.site-top{display:flex;align-items:center;gap:14px;padding:13px 0}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto;min-width:0}
.brand img{width:42px;height:42px;flex:0 0 auto;object-fit:contain}
.brand-text{display:flex;flex-direction:column;gap:1px;min-width:0}
.brand-text .bn{font-family:var(--font-serif);font-size:18px;font-weight:700;letter-spacing:.02em;white-space:nowrap;line-height:1.1}
.brand-text .bs{font-size:10px;color:#C9DAD8;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;line-height:1.1}
.hdr-link{padding:8px 12px;border-radius:8px;font-size:14px;font-weight:500;white-space:nowrap}
.hdr-link:hover{background:rgba(255,255,255,.1)}

.page-head{padding:34px 0 8px}
.page-head h1{font-family:var(--font-serif);font-size:27px;color:var(--ink);margin:0 0 6px}
.page-head p{margin:0;color:var(--muted-fg);font-size:14.5px;max-width:640px}

.searchbar{margin:22px 0 6px;display:flex;gap:8px}
.searchbar input{flex:1;height:50px;border:1.5px solid var(--border-strong);border-radius:12px;padding:0 18px;font-size:15px;font-family:inherit;background:var(--card);color:var(--fg);min-width:0}
.searchbar input:focus{outline:none;border-color:var(--focus)}
.searchbar button{height:50px;padding:0 22px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.searchbar button:hover{background:var(--accent-2)}
.searchbar button svg{width:18px;height:18px}

.filters{display:flex;flex-wrap:wrap;gap:16px 22px;align-items:center;padding:12px 2px 4px;font-size:13px;color:var(--muted-fg)}
.filters label{display:flex;align-items:center;gap:6px;cursor:pointer}
.filters input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent)}
.filters select,.filters input[type=number]{height:32px;border:1px solid var(--border-strong);border-radius:7px;background:#FCFAF6;font-family:inherit;font-size:13px;color:var(--fg);padding:0 8px}
.filters .sep{width:1px;align-self:stretch;background:var(--border)}

.expansion{margin:14px 0 0;padding:12px 14px;background:#EEF5F0;border:1px solid #CFE4D6;border-radius:10px;font-size:13px;color:var(--ink-2)}
.expansion b{color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid #CFE4D6;border-radius:999px;padding:3px 10px;margin:4px 6px 0 0;font-size:12.5px}
.chip .vi{color:var(--muted-fg)}
.chip .ar{color:#9BB3A5}

.meta-line{margin:20px 0 10px;font-size:13px;color:var(--muted-fg)}

.results{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.rc{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px}
.rc h3{margin:0 0 6px;font-size:16.5px;line-height:1.4;font-family:var(--font-serif);color:var(--ink)}
.rc h3 a:hover{color:var(--accent);text-decoration:underline}
.rc .authors{font-size:13px;color:var(--fg);margin:0 0 4px}
.rc .subline{font-size:12.5px;color:var(--muted-fg);margin:0 0 8px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.rc .abs{font-size:13.5px;color:#3C352C;margin:0 0 10px}
.rc .tags{display:flex;flex-wrap:wrap;gap:6px}
.badge{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;letter-spacing:.02em}
.badge.oa{background:#E7F3EA;color:#1F7A3D}
.badge.cite{background:#F1ECE0;color:#6B5B3E}
.badge.src{background:#ECEFF3;color:#4A5568}
.badge.topic{background:#F5EEF1;color:#8A4A64}
.badge.pubmed{background:#E3ECF7;color:#28568F}
.rc .links{margin-top:10px;display:flex;gap:14px;font-size:13px}
.rc .links a{color:var(--accent);font-weight:600}
.rc .links a:hover{text-decoration:underline}

.pager{display:flex;justify-content:center;align-items:center;gap:14px;margin:26px 0 50px}
.pager button{height:38px;padding:0 16px;border:1px solid var(--border-strong);border-radius:9px;background:var(--card);font-size:13.5px;font-weight:600;color:var(--ink)}
.pager button:disabled{opacity:.4;cursor:not-allowed}
.pager span{font-size:13px;color:var(--muted-fg)}

.state{text-align:center;padding:56px 20px;color:var(--muted-fg)}
.state.err{color:var(--accent-2)}
.spinner{width:26px;height:26px;border:3px solid var(--border-strong);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}

.disclaimer{margin:8px 0 40px;font-size:12px;color:#9B8F7E;text-align:center}
</style>
</head>
<body>
<header class="site">
  <div class="wrap site-top">
    <a class="brand" href="/">
      <img src="assets/logo.png" alt="Chimedis">
      <span class="brand-text">
        <span class="bn">CHIMEDIS</span>
        <span class="bs">Chinese Medicine Discovery</span>
      </span>
    </a>
    <a class="hdr-link" href="/">← Trang chủ</a>
    <a class="hdr-link" href="https://dict.chimedis.vn">Tra từ điển</a>
  </div>
</header>

<main class="wrap">
  <div class="page-head">
    <h1>Khám phá y văn</h1>
    <p>Tìm tài liệu nghiên cứu Trung Y trên các cơ sở dữ liệu học thuật uy tín — <b>OpenAlex</b> (~250 triệu công trình) và <b>Europe PMC</b> (y sinh). Gõ được bằng tiếng Việt: thuật ngữ YHCT sẽ tự dịch sang tiếng Anh để tra.</p>
  </div>

  <form class="searchbar" id="form">
    <input id="q" type="text" placeholder="Ví dụ: Hoàng kỳ điều trị đái tháo đường, châm cứu đau lưng, Bổ trung ích khí thang…" autocomplete="off">
    <button type="submit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      Tìm
    </button>
  </form>

  <div class="filters">
    <label><input type="checkbox" id="src-openalex" checked> OpenAlex</label>
    <label><input type="checkbox" id="src-europepmc" checked> Europe PMC</label>
    <div class="sep"></div>
    <label>Từ năm
      <select id="yearFrom">
        <option value="">Không giới hạn</option>
        <option value="2020">2020</option>
        <option value="2015">2015</option>
        <option value="2010">2010</option>
        <option value="2000">2000</option>
      </select>
    </label>
    <label><input type="checkbox" id="openAccess"> Chỉ bài đọc miễn phí (Open Access)</label>
    <label><input type="checkbox" id="pubmedOnly"> Chỉ bài có trong PubMed/MEDLINE</label>
  </div>

  <div id="out"></div>
</main>

<script>
const $ = (s) => document.querySelector(s);
const out = $('#out');
let state = { q: '', page: 1 };

function readForm() {
  const sources = [];
  if ($('#src-openalex').checked) sources.push('openalex');
  if ($('#src-europepmc').checked) sources.push('europepmc');
  return {
    q: $('#q').value.trim(),
    sources,
    yearFrom: $('#yearFrom').value,
    openAccess: $('#openAccess').checked ? '1' : '',
    pubmedOnly: $('#pubmedOnly').checked ? '1' : '',
  };
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

function sourceLabel(s) {
  return { openalex: 'OpenAlex', europepmc: 'Europe PMC' }[s] || s;
}

function renderExpansion(exp) {
  if (!exp) return '';
  const chips = exp.terms.map((t) => `
    <span class="chip"><span class="vi">${esc(t.vi)}</span><span class="ar">→</span><b>${esc(t.en)}</b></span>
  `).join('');
  return `<div class="expansion"><b>Đã nhận diện thuật ngữ YHCT</b> và dịch sang tiếng Anh để tra y văn quốc tế:<br>${chips}</div>`;
}

function renderCard(r) {
  const authors = r.authors && r.authors.length
    ? esc(r.authors.slice(0, 6).join(', ')) + (r.authors.length > 6 ? ', …' : '')
    : '<span style="color:var(--muted-fg)">Không rõ tác giả</span>';
  const sub = [];
  if (r.venue) sub.push(esc(r.venue));
  if (r.year) sub.push(r.year);
  if (r.type) sub.push(esc(r.type));
  const tags = [];
  if (r.inPubMed) tags.push('<span class="badge pubmed">PubMed</span>');
  if (r.isOpenAccess) tags.push('<span class="badge oa">Open Access</span>');
  if (typeof r.citations === 'number') tags.push(`<span class="badge cite">${r.citations} trích dẫn</span>`);
  (r.sources || []).forEach((s) => tags.push(`<span class="badge src">${sourceLabel(s)}</span>`));
  if (r.topic) tags.push(`<span class="badge topic">${esc(r.topic)}</span>`);
  const links = [];
  if (r.landingUrl) links.push(`<a href="${esc(r.landingUrl)}" target="_blank" rel="noopener">Xem nguồn ↗</a>`);
  if (r.oaUrl && r.oaUrl !== r.landingUrl) links.push(`<a href="${esc(r.oaUrl)}" target="_blank" rel="noopener">Toàn văn miễn phí ↗</a>`);
  if (r.pmid) links.push(`<a href="https://pubmed.ncbi.nlm.nih.gov/${esc(r.pmid)}/" target="_blank" rel="noopener">PubMed ↗</a>`);
  if (r.doi) links.push(`<a href="https://doi.org/${esc(r.doi)}" target="_blank" rel="noopener">DOI</a>`);
  return `<li class="rc">
    <h3>${r.landingUrl ? `<a href="${esc(r.landingUrl)}" target="_blank" rel="noopener">${esc(r.title)}</a>` : esc(r.title)}</h3>
    <p class="authors">${authors}</p>
    <p class="subline">${sub.map((x) => `<span>${x}</span>`).join('')}</p>
    ${r.abstract ? `<p class="abs">${esc(r.abstract)}</p>` : ''}
    <div class="tags">${tags.join('')}</div>
    ${links.length ? `<div class="links">${links.join('')}</div>` : ''}
  </li>`;
}

async function run(page) {
  const f = readForm();
  if (f.q.length < 2) { out.innerHTML = '<div class="state">Nhập từ khoá để bắt đầu tìm kiếm.</div>'; return; }
  if (!f.sources.length) { out.innerHTML = '<div class="state err">Chọn ít nhất một nguồn dữ liệu.</div>'; return; }
  state = { q: f.q, page };
  const params = new URLSearchParams({ q: f.q, page: String(page), sources: f.sources.join(',') });
  if (f.yearFrom) params.set('yearFrom', f.yearFrom);
  if (f.openAccess) params.set('openAccess', '1');
  if (f.pubmedOnly) params.set('pubmedOnly', '1');
  history.replaceState(null, '', '?' + params.toString());

  out.innerHTML = '<div class="state"><div class="spinner"></div>Đang tra cứu OpenAlex và Europe PMC…</div>';
  let data;
  try {
    const res = await fetch('/api/research/search?' + params.toString());
    data = await res.json();
    if (!res.ok || !data.success) throw new Error(data.error || 'Lỗi tìm kiếm');
  } catch (e) {
    out.innerHTML = `<div class="state err">${esc(e.message)}</div>`;
    return;
  }

  if (!data.results.length) {
    out.innerHTML = renderExpansion(data.expansion) +
      '<div class="state">Không tìm thấy tài liệu phù hợp. Thử từ khoá khác hoặc bỏ bớt bộ lọc.</div>';
    return;
  }

  const totalTxt = Object.entries(data.totalBySource || {})
    .map(([s, n]) => `${sourceLabel(s)}: ~${n.toLocaleString('vi-VN')}`).join(' · ');
  const srcErr = data.sourceErrors
    ? `<div class="state err" style="padding:10px;text-align:left">Một số nguồn lỗi: ${esc(JSON.stringify(data.sourceErrors))}</div>` : '';

  out.innerHTML =
    renderExpansion(data.expansion) +
    `<div class="meta-line">Trang ${data.page} — hiển thị ${data.count} kết quả đã gộp trùng. Tổng khớp: ${totalTxt}</div>` +
    srcErr +
    `<ul class="results">${data.results.map(renderCard).join('')}</ul>` +
    `<div class="pager">
       <button id="prev" ${data.page <= 1 ? 'disabled' : ''}>← Trước</button>
       <span>Trang ${data.page}</span>
       <button id="next" ${data.count < data.perPage ? 'disabled' : ''}>Sau →</button>
     </div>` +
    `<p class="disclaimer">Dữ liệu từ OpenAlex &amp; Europe PMC. Nội dung phục vụ học tập, nghiên cứu — không thay thế tư vấn y khoa.</p>`;

  const prev = $('#prev'), next = $('#next');
  if (prev) prev.onclick = () => run(state.page - 1);
  if (next) next.onclick = () => run(state.page + 1);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

$('#form').addEventListener('submit', (e) => { e.preventDefault(); run(1); });
['yearFrom', 'openAccess', 'pubmedOnly', 'src-openalex', 'src-europepmc'].forEach((id) => {
  $('#' + id).addEventListener('change', () => { if (state.q) run(1); });
});

// Nạp truy vấn từ URL (khi đến từ ô tìm kiếm trang chủ).
(function initFromUrl() {
  const p = new URLSearchParams(location.search);
  const q = p.get('q');
  if (q) {
    $('#q').value = q;
    if (p.get('yearFrom')) $('#yearFrom').value = p.get('yearFrom');
    if (p.get('openAccess') === '1') $('#openAccess').checked = true;
    if (p.get('pubmedOnly') === '1') $('#pubmedOnly').checked = true;
    const srcs = (p.get('sources') || '').split(',').filter(Boolean);
    if (srcs.length) {
      $('#src-openalex').checked = srcs.includes('openalex');
      $('#src-europepmc').checked = srcs.includes('europepmc');
    }
    run(parseInt(p.get('page'), 10) || 1);
  }
})();
</script>
</body>
</html>
